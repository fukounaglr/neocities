        <style>

            .gallery-grid {
                display: none;
            }

            #gallery.grid {
                & .gallery-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    grid-gap: 5px;
                    text-align: center;
                    padding: 10px;

                    & img {
                        width: 100%;
                        aspect-ratio: 1/1;
                        object-fit: cover;
                        margin: auto;
                    }
                }
            }

            #gallery.full {
                & .gallery-grid {
                    display: block;
                    text-align: center;
                    padding: 10px;
                    background-color: var(--colour);

                    & img {
                        width: 100%;
                        object-fit: cover;
                        margin: auto;
                    }
                }
            }


            #view-toggle {
                display: grid;
                grid-template-columns: 1fr 1fr;
                margin: auto;
                height: 60px;

                & button {
                    all: unset;
                    width: 90%;
                    text-align: center;
                    background-color: var(--acc);
                    padding: 10px 0;
                    margin: auto;
                    cursor: pointer;
                    color: black;
                }
            }

            @media only screen and (max-width: 800px) {
                

                .gallery-grid {
                    grid-template-columns: 1fr 1fr;
                }

            }
        </style>
    </head>
