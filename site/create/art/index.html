<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>art</title>
        <link rel="icon" type="image/png" href="/ico.png">
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="/create/style.css">

        <style>

            .gallery-grid {
                display: none;
            }

            #gallery.grid {
                & .gallery-grid {
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    grid-gap: 5px;
                    text-align: center;
                    padding: 10px;

                    & img {
                        width: 100%;
                        aspect-ratio: 1/1;
                        object-fit: cover;
                        margin: auto;
                    }
                }
            }

            #gallery.full {
                & .gallery-grid {
                    display: block;
                    text-align: center;
                    padding: 10px;
                    background-color: var(--colour);

                    & img {
                        width: 100%;
                        object-fit: cover;
                        margin: auto;
                    }
                }
            }


            #view-toggle {
                display: grid;
                grid-template-columns: 1fr 1fr;
                margin: auto;
                height: 60px;

                & button {
                    all: unset;
                    width: 90%;
                    text-align: center;
                    background-color: var(--acc);
                    padding: 10px 0;
                    margin: auto;
                    cursor: pointer;
                    color: black;
                }
            }

            @media only screen and (max-width: 800px) {
                

                .gallery-grid {
                    grid-template-columns: 1fr 1fr;
                }

            }
        </style>
    </head>

    <body>
        <main>
                <h4>Art</h4>
                <p>Hello I'm a digital artist and animator fukounaglr!</p>
                <p>Here you can find some info about my arts!</p>
                <img src="/images/pfp.png" style="margin: 10px">
                <p>here are my links!!!</p>
                <iframe src="/links.html" title="links" style="width: calc(100% - 22px); height: 50px; overflow: auto; border: "></iframe>

                <h5>tools i use</h5>

                    <li><span>tablet: Gaomon M1220</span></li>
                    <li><span>drawing &amp; animation: Clip Studio Paint EX v5</span></li>
                    <li><span>workspace: 2159847</span></li>
                    <li><span>editing: capcut</span></li>
                </ul>


            <footer style="text-align: center;">
                <img title="this is an anti-NFT site" src="/graphics/buttons/antinft.png">
