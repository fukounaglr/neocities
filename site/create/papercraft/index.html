<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Papercraft</title>

    <link rel="icon" type="image/png" href="/ico.png" />
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/create/style.css" />


    <style>
        header,
        #side-col {
            align-content: center;
            display: grid;
        }

        b {
            color: white;
        }

        main {
            display: grid;
            grid-template-columns: 1fr;
            text-align: center;
            max-width: 800px;
        }

        .create-link {
            background-color: dimgray;
            text-align: left;
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            padding: 20px;

            & img {
                width: 200px;
                display: block;
            }

            &:hover {
                color: lightgray;

                & h5::before {
                    letter-spacing: 0;
                }
            }

            & h5::before {
                content: ">>> ";
                letter-spacing: -8px;
                margin: auto 10px;
                transition: .5s;
            }

            & a {
                color: white;

                & img {
                    width: 16px;
                    display: inline
                }
            }
        }
    </style>
</head>

<body>


    <main>
        <header>
            <h3>Papercraft</h3>
            <p>Made with <a href="https://www.blender.org/">Blender</a> and <a href="https://papercraft-maker.com/">papercraft maker</a></p>
            <details>
                <summary><h5>How to use</h5></summary>
                <p><b>1. cut</b> following the black solid lines</p>
                <p><b>2. fold</b> dashed lines</p>
                <p><b>3. glue</b> the parts with the same number/letter</p>
                <p><b>done!</b> now you have paper model :&#41;</p>
            </details>
        </header>
        <hr>
    </main>
</body>

</html>
