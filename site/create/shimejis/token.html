<!DOCTYPE html>

    <head>

        <link rel="stylesheet" href="/style.css" />
        <link rel="stylesheet" href="/create/style.css" />


        <style>

            main {
                display: grid;
                grid-template-columns: 1fr;
                text-align: center;
                max-width: 800px;
            }

            .create-link {
                text-align: left;
                width: 90%;
                max-width: 400px;
                margin: 20px auto;
                padding: 20px;

                & img {
                    width: 200px;
                    display: block;
                }

                &:hover {
                    color: lightgray;

                    & h5::before {
                        letter-spacing: 0;
                    }
                }

                & h5::before {
                    content: ">>> ";
                    letter-spacing: -8px;
                    margin: auto 10px;
                    transition: .5s;
                }

                & a {
                    /*color: white;*/

                    & img {
                        width: 16px;
                        display: inline
                    }
                }
            }
        </style>
    </head>

    <body>


        <main>
            <div class="create-link">
                <h5>Token</h5>
                <p>By Noelle from <a href="https://www.youtube.com/@Femtanyl03">femtanyl</a></p>
                <img src="/create/images/shime-token.png">
                <a href="https://file.garden/ZjOP8Ik9OUXT6YVm/token%20shimeji.zip"><img src="/create/images/icon-token.png"> click to download</a>
            </div>
        </main>
